{% extends "layout.html" %}
{% block content %}
<div class="space-y-8">
  <div class="flex items-center space-x-4">
    <input type="text" id="snapshot-name" placeholder="Optional snapshot name"
      class="inline-flex w-64 rounded-md border-0 py-1.5 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
    >
    <button
      type="button"
      class="notify-result rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      hx-post="/api/snapshots"
      hx-vals="js:{ name: document.getElementById('snapshot-name').value }"
      hx-swap="none"
      hx-on::after-request="document.getElementById('snapshot-name').value = ''; htmx.trigger(document.getElementById('snapshot-list-body'), 'refresh', {});"
    >Capture Snapshot</button>
  </div>

  <div class="px-4 sm:px-6 lg:px-8">
    <h2 class="text-lg font-semibold leading-6 text-gray-900">Captured Snapshots</h2>
    <div class="mt-4 flow-root">
      <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
        <div class="inline-block min-w-full px-0 py-2 align-middle">
          <table class="min-w-full divide-y divide-gray-300">
            <thead>
              <tr>
                <th scope="col" class="py-2.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0">Snapshot ID</th>
                <th scope="col" class="px-1 py-2.5 text-left text-sm font-semibold text-gray-900">Name</th>
                <th scope="col" class="px-1 py-2.5 text-left text-sm font-semibold text-gray-900">Running Tasks</th>
                <th scope="col" class="px-1 py-2.5 text-left text-sm font-semibold text-gray-900">Terminated Tasks</th>
                <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-0">
                  <span class="sr-only">Action</span>
                </th>
              </tr>
            </thead>
            <tbody id="snapshot-list-body" class="divide-y divide-gray-200"
              hx-trigger="load,refresh from:body"
              hx-get="/api/snapshots"
              hx-swap="innerHTML"
              mustache-template="snapshot-list-template"
            >
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="px-4 sm:px-6 lg:px-8">
    <h2 class="text-lg font-semibold leading-6 text-gray-900">Compare Snapshots (Diff)</h2>
    <div class="mt-4 flex items-center space-x-3">
      <input type="text" id="diff-snapshot-1" placeholder="From Snapshot ID"
        class="inline-flex w-40 rounded-md border-0 py-1.5 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
      >
      <input type="text" id="diff-snapshot-2" placeholder="To Snapshot ID"
        class="inline-flex w-40 rounded-md border-0 py-1.5 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
      >
      <button
        type="button"
        class="rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500"
        hx-post="/api/snapshots/diff"
        hx-vals="js:{
          snapshot_id_1: document.getElementById('diff-snapshot-1').value,
          snapshot_id_2: document.getElementById('diff-snapshot-2').value,
        }"
        hx-target="#snapshot-detail-view"
        hx-swap="innerHTML"
        mustache-template="snapshot-diff-template"
      >Diff</button>
    </div>
  </div>

  <div id="snapshot-detail-view" class="px-4 sm:px-6 lg:px-8"></div>
</div>

{% raw %}
<template id="snapshot-list-template">
{{# snapshots}}
<tr>
  <td class="whitespace-nowrap px-1 py-2 text-sm font-medium text-gray-900">{{ snapshot_id }}</td>
  <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ name }}</td>
  <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ running_count }}</td>
  <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ terminated_count }}</td>
  <td class="relative whitespace-nowrap px-1 py-2 text-right text-sm font-medium sm:pr-0 space-x-1">
    <button
      type="button"
      class="rounded bg-indigo-600 px-2 py-1 text-xs font-semibold text-white shadow-sm hover:bg-indigo-500"
      hx-post="/api/snapshots/tasks"
      hx-vals='{"snapshot_id": "{{ snapshot_id }}"}'
      hx-target="#snapshot-detail-view"
      hx-swap="innerHTML"
      mustache-template="snapshot-tasks-template"
    >Tasks</button>
    <button
      type="button"
      class="notify-result rounded bg-rose-600 px-2 py-1 text-xs font-semibold text-white shadow-sm hover:bg-rose-500"
      hx-delete="/api/snapshots"
      hx-vals='{"snapshot_id": "{{ snapshot_id }}"}'
      hx-swap="none"
      hx-on::after-request="htmx.trigger(document.getElementById('snapshot-list-body'), 'refresh', {});"
    >Delete</button>
  </td>
</tr>
{{/ snapshots}}
</template>

<template id="snapshot-tasks-template">
<div class="mt-4">
  <h3 class="text-base font-semibold leading-6 text-gray-900">Snapshot {{ snapshot_id }} Tasks</h3>
  <table class="mt-2 min-w-full divide-y divide-gray-300">
    <thead>
      <tr>
        <th scope="col" class="py-2 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0">Task ID</th>
        <th scope="col" class="px-1 py-2 text-left text-sm font-semibold text-gray-900">State</th>
        <th scope="col" class="px-1 py-2 text-left text-sm font-semibold text-gray-900">Name</th>
        <th scope="col" class="px-1 py-2 text-left text-sm font-semibold text-gray-900">Coroutine</th>
        <th scope="col" class="px-1 py-2 text-left text-sm font-semibold text-gray-900">Created Loc.</th>
        <th scope="col" class="px-1 py-2 text-left text-sm font-semibold text-gray-900">Since</th>
        <th scope="col" class="relative py-2 pl-3 pr-4 sm:pr-0"><span class="sr-only">Trace</span></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200">
      {{# tasks}}
      <tr>
        <td class="whitespace-nowrap px-1 py-2 text-sm font-medium text-gray-900">{{ task_id }}</td>
        <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ state }}</td>
        <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ name }}</td>
        <td class="whitespace-nowrap px-1 py-2 font-mono text-xs text-gray-500">{{ coro }}</td>
        <td class="break-all px-1 py-2 font-mono text-xs text-gray-500">{{ created_location }}</td>
        <td class="whitespace-nowrap px-1 py-2 font-mono text-sm text-gray-500">{{ since }}</td>
        <td class="relative whitespace-nowrap px-1 py-2 text-right text-sm font-medium sm:pr-0">
          <a
            class="cursor-pointer rounded bg-indigo-600 px-2 py-1 text-xs font-semibold text-white shadow-sm hover:bg-indigo-500"
            href="/trace-snapshot?snapshot_id={{ snapshot_id }}&task_id={{ task_id }}"
          >Trace</a>
        </td>
      </tr>
      {{/ tasks}}
    </tbody>
  </table>
</div>
</template>

<template id="snapshot-diff-template">
<div class="mt-4 space-y-6">
  <div>
    <h3 class="text-base font-semibold leading-6 text-green-700">Added Tasks</h3>
    <table class="mt-2 min-w-full divide-y divide-gray-300">
      <tbody class="divide-y divide-gray-200">
        {{# added}}
        <tr>
          <td class="whitespace-nowrap px-1 py-2 text-sm font-medium text-gray-900">{{ task_id }}</td>
          <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ name }}</td>
          <td class="whitespace-nowrap px-1 py-2 font-mono text-xs text-gray-500">{{ coro }}</td>
        </tr>
        {{/ added}}
      </tbody>
    </table>
  </div>
  <div>
    <h3 class="text-base font-semibold leading-6 text-rose-700">Removed Tasks</h3>
    <table class="mt-2 min-w-full divide-y divide-gray-300">
      <tbody class="divide-y divide-gray-200">
        {{# removed}}
        <tr>
          <td class="whitespace-nowrap px-1 py-2 text-sm font-medium text-gray-900">{{ task_id }}</td>
          <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ name }}</td>
          <td class="whitespace-nowrap px-1 py-2 font-mono text-xs text-gray-500">{{ coro }}</td>
        </tr>
        {{/ removed}}
      </tbody>
    </table>
  </div>
  <div>
    <h3 class="text-base font-semibold leading-6 text-gray-700">Common Tasks</h3>
    <table class="mt-2 min-w-full divide-y divide-gray-300">
      <tbody class="divide-y divide-gray-200">
        {{# common}}
        <tr>
          <td class="whitespace-nowrap px-1 py-2 text-sm font-medium text-gray-900">{{ task_id }}</td>
          <td class="whitespace-nowrap px-1 py-2 text-sm text-gray-500">{{ name }}</td>
          <td class="whitespace-nowrap px-1 py-2 font-mono text-xs text-gray-500">{{ coro }}</td>
        </tr>
        {{/ common}}
      </tbody>
    </table>
  </div>
</div>
</template>
{% endraw %}
{% endblock %}
